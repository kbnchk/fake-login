<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password · Northgate Portal</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="notfound">
    <section class="card">
        <h2>Reset your password</h2>
        <p class="sub">Enter your work email and we'll send you a reset link.</p>
        <div class="alert info" id="alert" role="status">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
            <span>If an account exists for this address, a reset link is on its way.</span>
        </div>
        <form id="forgot" novalidate>
            <div class="field" id="f-email">
                <label for="email">Work email</label>
                <div class="input">
                    <svg class="lead" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
                </div>
                <div class="msg" id="m-email">Enter a valid email address.</div>
            </div>
            <button class="btn" type="submit"><span class="spin"></span><span>Send reset link</span></button>
        </form>
        <p class="sub" class="backlink"><a href="/">Back to sign in</a></p>
    </section>
</main>
<script src="/script.js"></script>
</body>
</html>
